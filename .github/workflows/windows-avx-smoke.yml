name: Windows AVX engine smoke test

# Checks the published zip the way a PC gets it: the public download, the digest setup.py compares, the CUDA wheels setup.py
# installs, then the programs started for real. Intel's SDE then runs them on an emulated Sandy Bridge (AVX, no AVX2), which
# stops on any AVX2/FMA/AVX-512 instruction that actually executes. The runner has no GPU, so only start-up is covered.

on:
  push:
    paths:
      - .github/workflows/windows-avx-smoke.yml
  workflow_run:
    workflows: [Windows AVX engine]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

env:
  SDE_URL: https://downloadmirror.intel.com/859732/sde-external-9.58.0-2025-06-16-win.tar.xz

jobs:
  smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Download the published zip and compare its digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl.exe -fsSL -o strata.zip "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/strata-windows-x64.zip"
          if ($LASTEXITCODE -ne 0) { throw 'public download failed' }
          $want = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.assets[] | select(.name=="strata-windows-x64.zip") | .digest'
          $have = 'sha256:' + (Get-FileHash strata.zip -Algorithm SHA256).Hash.ToLower()
          "published $want"; "download  $have"
          if ($want -ne $have) { throw 'digest differs' }
          Expand-Archive strata.zip -DestinationPath stage
          Get-Content stage\BUILD.json
          if ((Get-Content stage\BUILD.json | ConvertFrom-Json).isa_floor -ne 'avx') { throw 'zip is not the AVX build' }
      - name: Without the CUDA wheels (expected to report a missing DLL)
        run: |
          .\stage\strata.exe --version
          $code = '0x{0:X8}' -f $LASTEXITCODE
          "exit code $code"
          if ($code -ne '0xC0000135') { "note: expected 0xC0000135 on a PC without cuBLAS" }
          exit 0
      - name: Install the CUDA wheels setup.py installs
        run: |
          $wheels = python -c "import re,ast;print(' '.join(ast.literal_eval(re.search(r'^CUDA_WHEELS = (\[.*?\])', open('setup.py',encoding='utf-8').read(), re.M).group(1))))"
          "wheels: $wheels"
          python -m pip install --quiet $wheels.Split(' ')
          $dir = python -c "import sys,pathlib;print(next(pathlib.Path(p/'nvidia') for p in map(pathlib.Path,sys.path) if (p/'nvidia').is_dir()).joinpath('cu13','bin','x86_64'))"
          "$dir"
          if (-not (Test-Path "$dir\cublas64_13.dll")) { throw 'no cublas64_13.dll' }
          $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Start the programs
        env:
          STRATA_FORCE_ISA: avx
        run: |
          foreach ($p in 'strata','strata-vision','strata-dsv41') {
            & ".\stage\$p.exe" --version
            $code = '0x{0:X8}' -f $LASTEXITCODE
            "$p exit code $code"
            if ($code -in '0xC0000135','0xC000007B','0xC000001D','0xC0000005') { throw "$p did not start: $code" }
          }
          .\stage\strata.exe --version
          if ($LASTEXITCODE -ne 0) { throw "strata --version exit $LASTEXITCODE" }
      - name: Fetch Intel SDE
        timeout-minutes: 15
        run: |
          curl.exe -fsSL --http1.1 --connect-timeout 30 --max-time 240 --retry 2 -o sde.tar.xz $env:SDE_URL
          if ($LASTEXITCODE -ne 0) { throw "SDE download failed: curl $LASTEXITCODE" }
          (Get-Item sde.tar.xz).Length
          mkdir sde | Out-Null
          tar -xf sde.tar.xz -C sde
          if ($LASTEXITCODE -ne 0) { throw "SDE unpack failed: tar $LASTEXITCODE" }
          $exe = (Get-ChildItem sde -Recurse -Filter sde.exe | Select-Object -First 1).FullName
          "SDE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Control - SDE must stop a program that executes AVX2
        shell: cmd
        run: |
          > avx2.c echo #include ^<immintrin.h^>
          >> avx2.c echo int main(int c,char**v){volatile int x=c;__m256i a=_mm256_set1_epi32(x);a=_mm256_add_epi32(a,a);return _mm256_extract_epi32(a,0)==2*x?0:1;}
          cl /nologo /O1 /arch:AVX2 avx2.c || exit /b 1
          avx2.exe || exit /b 1
          echo native run ok
          "%SDE%" -snb -- avx2.exe > control.txt 2>&1
          set CODE=%ERRORLEVEL%
          type control.txt
          echo sde exit %CODE%
          if "%CODE%"=="0" ( echo SDE let AVX2 through, so the next step would prove nothing & exit /b 1 )
          exit /b 0
      - name: Start the programs on an emulated AVX-only CPU
        shell: pwsh
        run: |
          $bad = $false
          foreach ($p in 'strata','strata-vision','strata-dsv41') {
            $out = & $env:SDE -snb -- ".\stage\$p.exe" --version 2>&1 | Out-String
            $code = $LASTEXITCODE
            $out
            "$p under SDE: exit $code"
            if ($out -match 'SDE-ERROR|Illegal|not supported|unsupported') { "$p ran an instruction this CPU does not have"; $bad = $true }
          }
          if ($bad) { exit 1 }
          exit 0
